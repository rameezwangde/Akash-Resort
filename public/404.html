<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-[#8]">
    <title>Akash Lavish Resort</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages / Static Hosting SPA Redirect
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + (l.pathname.split('/')[1] ? '/' + l.pathname.split('/')[1] : '') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>

  </body>
</html>
